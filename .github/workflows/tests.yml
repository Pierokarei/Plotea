name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Un nouveau commit rend caduc le run precedent de la meme branche : on
# l'annule plutot que de le laisser occuper des machines pour rien.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # La suite prend 3 a 15 minutes ; au-dela, quelque chose est bloque, et
    # GitHub attendrait sinon six heures avant de l'arreter.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Qt needs an X stack and a few system libraries on Linux runners.
      - name: Dependances systeme Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 fonts-liberation

      - name: Installation
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check plotea tests tools run_plotea.py

      # Les tests macOS ont cesse de finir : ce releve dit en une minute
      # combien coutent un rendu et chaque export, et quelles polices ont
      # ete trouvees, en annotations lisibles sans compte.
      - name: Diagnostic du rendu (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 10
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
        run: python tools/render_timing.py

      # Ces tests echouent ou bloquent sous macOS seulement : on les lance a
      # part, une minute au lieu de trente-cinq, et on republie leurs erreurs.
      - name: Diagnostic des echecs (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        timeout-minutes: 10
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
        run: >-
          python tools/ci_diagnose.py
          tests/test_feedback.py::test_figure_size_does_not_move_the_panels
          tests/test_feedback.py::test_canvas_shows_the_figure_size
          tests/test_panels.py::test_panel_tab_workflow
          tests/test_window_actions.py::test_exporting_every_figure_including_a_composite
          tests/test_window_actions.py::test_two_figures_never_share_a_file

      - name: Tests
        # en echec plutot qu'annule au-dela : l'etape suivante peut alors
        # republier la fin du journal
        timeout-minutes: 35
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
          # La couverture ne tourne que sur un job : elle double la duree et
          # le chiffre est le meme partout. Le seuil est juste sous la valeur
          # du jour, donc il ne tombe que sur une vraie regression.
          COV: ${{ (matrix.os == 'ubuntu-latest' && matrix.python == '3.13')
                   && '--cov=plotea --cov-report=term-missing:skip-covered --cov-fail-under=91'
                   || '' }}
        shell: bash
        run: |
          set -o pipefail
          # Un test bloque echoue au bout de 10 minutes en affichant la pile
          # de chaque fil : c'est ce que l'etape suivante republie.
          pytest tests -v --durations=10 --timeout=600 --timeout-method=thread $COV 2>&1 | tee pytest.log

      # GitHub demande maintenant une connexion pour lire les journaux, y
      # compris sur un depot public. La fin de la sortie est donc republiee
      # en annotation, qui reste lisible sans compte et via l'API.
      - name: Detail de l'echec
        if: failure()
        shell: bash
        run: |
          test -f pytest.log || exit 0
          detail=$(tail -n 80 pytest.log | tr -d '\r' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=pytest ${{ matrix.os }} py${{ matrix.python }}::$detail"


      - name: Sorties de test
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sorties-${{ matrix.os }}-${{ matrix.python }}
          path: |
            tests/_out/
            pytest.log
          retention-days: 5

  build:
    name: Binaire autonome (${{ matrix.os }})
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Dependances systeme Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon-x11-0 libxcb-cursor0 fonts-liberation

      - name: Installation
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller

      - name: Construction
        run: python tools/build_app.py

      - name: Verification du binaire
        env:
          PLOTEA_SELFTEST: "1"
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./dist/Plotea/Plotea.exe
          elif [ "$RUNNER_OS" = "macOS" ]; then
            ./dist/Plotea.app/Contents/MacOS/Plotea
          else
            ./dist/Plotea/Plotea
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: plotea-${{ matrix.os }}
          path: dist/
          retention-days: 14
