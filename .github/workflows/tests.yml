name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Qt needs an X stack and a few system libraries on Linux runners.
      - name: Dependances systeme Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 fonts-liberation

      - name: Installation
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check plotea tests tools run_plotea.py

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
        run: pytest tests -q --durations=10

      - name: Figures produites
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sorties-${{ matrix.os }}-${{ matrix.python }}
          path: tests/_out/
          retention-days: 5

  build:
    name: Binaire autonome (${{ matrix.os }})
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Dependances systeme Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon-x11-0 libxcb-cursor0 fonts-liberation

      - name: Installation
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller

      - name: Construction
        run: python tools/build_app.py

      - name: Verification du binaire
        env:
          PLOTEA_SELFTEST: "1"
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./dist/Plotea/Plotea.exe
          elif [ "$RUNNER_OS" = "macOS" ]; then
            ./dist/Plotea.app/Contents/MacOS/Plotea
          else
            ./dist/Plotea/Plotea
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: plotea-${{ matrix.os }}
          path: dist/
          retention-days: 14
