[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plotea"
version = "1.0.0"
description = "Figures scientifiques de qualite publication - alternative libre a GraphPad Prism"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["science", "plotting", "matplotlib", "publication", "statistics",
            "prism", "figures"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "PyQt6>=6.5",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.1", "pyinstaller>=6"]

[project.scripts]
plotea = "plotea.app:main"

[project.gui-scripts]
plotea-gui = "plotea.app:main"

[tool.setuptools.packages.find]
include = ["plotea*"]

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    # curve_fit says so when a model cannot pin every parameter; the fit
    # itself is still reported with its R2.
    "ignore:Covariance of the parameters could not be estimated",
]
markers = ["slow: tests that render six-figure tables"]
